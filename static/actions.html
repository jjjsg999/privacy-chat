<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actions &middot; Privacy LLM</title><link rel="stylesheet" href="/static/style.css"><script src="/static/theme.js"></script><script src="/static/actions.js" defer></script><script src="/static/navigation.js" defer></script><script src="/static/sidebar-resize.js" defer></script></head>
<body class="workspace-page"><aside id="sidebar"><a class="brand" href="/">Privacy <span>LLM</span></a><p class="eyebrow">YOUR PERSONAL WORKSPACE</p><nav class="main-nav" aria-label="Main navigation"><a href="/">Meetings &amp; chat</a><a href="/adviser">Adviser chat</a><a href="/actions" aria-current="page">Actions</a><a href="/memory">Memory</a><a href="/settings">Settings</a></nav></aside><div class="workspace-main"><header><button id="toggle-sidebar" aria-label="Toggle navigation" aria-expanded="false" aria-controls="sidebar">&#9776;</button><h1>Actions</h1><span class="local-badge">Local workspace</span></header><div class="workspace-scroll"><main class="settings-content">
  <p class="eyebrow">ACROSS ALL MEETINGS</p><h1>Action tracker</h1>
  <p class="intro">Actions the meeting analysis found, with a status you control. Nothing here calls a model, and a status is saved only on this machine.</p>
  <section class="settings-card">
    <div class="actions-filters">
      <div><label for="f-status">Status</label><select id="f-status"><option value="open">Open</option><option value="done">Done</option><option value="all">All</option></select></div>
      <div><label for="f-owner">Owner</label><select id="f-owner"><option value="">Anyone</option></select></div>
      <div><label for="f-meeting">Meeting</label><select id="f-meeting"><option value="">All meetings</option></select></div>
      <label class="favourite-filter"><input id="f-archived" type="checkbox"> Include archived meetings</label>
    </div>
    <p id="count" role="status" aria-live="polite"></p>
    <div id="list"></div>
  </section>
</main></div></div></body>
</html>
